<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Your request · Juniper Market</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></span>Refund Relay</a>
  </header>
  <main class="narrow">
    <div id="error" class="notice bad hidden" role="alert"></div>
    <div id="flash" aria-live="polite"></div>
    <div id="card" class="hidden" aria-live="polite"></div>
    <form id="more" class="card hidden">
      <h2>Add photos</h2><p class="muted small" style="margin:-6px 0 14px">Answer the shop's request above with one or more photos.</p>
      <div class="dropzone" id="drop">
        <span id="drop-text"><strong>Choose photos</strong> or drag them here</span>
        <div class="thumbs sm" id="previews"></div>
        <input id="photos" name="photos" type="file" accept="image/jpeg,image/png" multiple required aria-label="Photos">
      </div>
      <button class="primary lg" type="submit" id="send" style="margin-top:16px">Send photos</button>
    </form>
  </main>
  <script type="module">
    import { api, usd, esc, hashToken, when, checkBadge, ICON, busy, settle, optionText, optionArt, optionAmount } from "/app.js";
    import { shrinkPhotos } from "/photos.js";
    const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    const claimId = new URLSearchParams(location.search).get("claim");
    const token = hashToken();
    const $ = (id) => document.getElementById(id);
    const fail = (msg) => { $("error").textContent = msg; $("error").classList.toggle("hidden", !msg); };

    // Three steps, like an order tracker: sent, shop reviews, outcome.
    function steps(s) {
      const outcome = { closed: "Closed", resolved: "Sorted", refunded: "Refunded", refund_processing: "Refunding" }[s.status] ?? "Resolved";
      const at = { new: 1, ready: 1, needs_info: 1, offer_sent: 1, refund_processing: 2, refunded: 3, resolved: 3, closed: 3 }[s.status] ?? 1;
      return ["Sent", s.status === "needs_info" ? "Photo needed" : s.status === "offer_sent" || s.offer ? "Your choice" : "Shop reviews", outcome].map((label, i) => {
        const cls = i < at ? "done" : i === at ? "now" : "";
        return `<li class="${s.status === "closed" && i === 2 ? "stop" : cls}">${label}</li>`;
      }).join("");
    }

    // The options the shop approved. Before a pick they are buttons; after, the pick stays highlighted.
    function optionsHtml(offer) {
      const art = (o) => `<span class="art">${optionArt(o)}</span>`;
      return `<div class="options" role="group" aria-label="Ways to put this right">${offer.options.map((o) => {
        const t = optionText(o);
        const chosen = offer.chosen === o.id;
        if (!offer.open && !chosen) return "";
        return `<button type="button" class="option${/gold/i.test(o.title) ? " gold" : ""}${chosen ? " chosen" : ""}" data-option="${esc(o.id)}" ${offer.open ? "" : "disabled"} aria-pressed="${chosen}">
          ${art(o)}<span><b>${esc(t.title)}</b><span class="detail">${esc(t.detail)}</span></span><span class="amt">${optionAmount(o)}</span></button>`;
      }).join("")}</div>`;
    }

    let last = "";
    function render(s) {
      if (JSON.stringify(s) === last) return;
      last = JSON.stringify(s);
      const refunded = s.refund?.state === "issued";
      $("card").innerHTML = `
        <div class="card hero">
          ${refunded || s.status === "resolved" ? checkBadge() : ""}
          <p class="eyebrow" style="margin:0">Request ${esc(s.ref)}</p>
          ${refunded ? `<div class="big amount">${usd(s.refund.amountCents)}</div>` : ""}
          <h2 style="font-size:28px;letter-spacing:-0.03em">${esc(chosen(s)?.item && (refunded || s.status === "resolved") ? `${refunded ? "Refund sent." : "All sorted."} ${cap(chosen(s).item)} is on its way.` : s.message)}</h2>
          <ol class="tracker" style="--n:3;margin:28px 0 8px">${steps(s)}</ol>
        </div>
        ${s.offer?.open ? `<div class="card"><h2 style="margin-top:0">Pick one</h2><p class="muted" style="margin-top:-6px">The shop approved every option here. The amount on each is what comes back to your PayPal account.</p>${optionsHtml(s.offer)}
          <div id="confirm-wrap" class="confirm-wrap"><button type="button" id="confirm" class="primary lg" disabled>Choose an option</button>
          <p class="footnote center" style="margin:10px 0 0">Your choice is final. Any refund goes straight back through PayPal.</p></div></div>` : ""}
        ${s.offer && !s.offer.open ? `<div class="card"><h2 style="margin-top:0">You chose</h2>${optionsHtml(s.offer)}${chosen(s)?.item ? `<p class="footnote" style="margin:12px 0 0">The shop will post it to the address on your PayPal order.</p>` : ""}</div>` : ""}
        ${s.infoRequest ? `<div class="notice warn">${ICON.info}<span><b>The shop asks:</b> ${esc(s.infoRequest)}</span></div>` : ""}
        ${s.closeReason ? `<div class="notice">${ICON.info}<span><b>The shop's reason:</b> ${esc(s.closeReason.replace(/[.!?\s]+$/, ""))}. You can still use PayPal's own resolution options.</span></div>` : ""}
        <div class="card">
          <div class="kv-row"><span>Item</span><span>${esc(s.item)} × ${s.quantity}</span></div>
          <div class="kv-row"><span>Sent</span><span>${when(s.createdAt)}</span></div>
          ${s.refund ? `<div class="kv-row"><span>Refund</span><span class="amount">${usd(s.refund.amountCents)} USD · ${refunded ? "issued through PayPal" : "processing"}</span></div>` : ""}
          ${s.refund?.refundId ? `<div class="kv-row"><span>PayPal refund ID</span><span class="mono">${esc(s.refund.refundId)}</span></div>` : ""}
        </div>
        ${refunded ? `<p class="footnote center" style="margin-top:16px">It goes back to how you paid. Depending on your bank, that can take a few days.</p>` : ""}`;
      $("card").classList.remove("hidden");
      $("more").classList.toggle("hidden", s.status !== "needs_info");
      // Pick first, then confirm: one stray tap never sends a refund.
      document.querySelectorAll("[data-option]:not([disabled])").forEach((b) => (b.onclick = () => {
        document.querySelectorAll("[data-option]").forEach((x) => { x.classList.toggle("selected", x === b); x.setAttribute("aria-pressed", x === b); });
        const o = s.offer.options.find((x) => x.id === b.dataset.option);
        $("confirm").disabled = false;
        $("confirm").textContent = o.kind === "refund" ? `Confirm ${usd(o.refundCents)} refund` : `Confirm: ${o.title}`;
        $("confirm").onclick = () => choose(s.offer.id, b);
      }));
    }
    const chosen = (s) => s.offer?.options.find((o) => o.id === s.offer.chosen && o.kind !== "refund");

    async function choose(offerId, btn) {
      document.querySelectorAll("[data-option]").forEach((b) => (b.disabled = true));
      busy($("confirm"), true, "Confirming…");
      fail("");
      try { render(await api(`/api/claims/${encodeURIComponent(claimId)}/choose`, { method: "POST", body: { offerId, optionId: btn.dataset.option }, token })); }
      catch (err) { fail(err.message); last = ""; await load(); }
    }
    const load = () => api(`/api/claims/${encodeURIComponent(claimId)}/status`, { token }).then(render,
      (e) => fail(e.status === 403 ? `${e.message} Open the status link you got when you sent the request, on the device you used.` : e.message));
    await load();
    settle();
    setInterval(load, 5000);

    $("photos").onchange = (e) => {
      const n = e.target.files.length;
      $("previews").innerHTML = "";
      for (const f of e.target.files) { const img = new Image(); img.src = URL.createObjectURL(f); img.alt = f.name; $("previews").append(img); }
      $("drop").classList.toggle("has-files", n > 0);
      $("drop-text").innerHTML = n ? `${n} photo${n > 1 ? "s" : ""} added · <strong>Change</strong>` : `<strong>Choose photos</strong> or drag them here`;
    };
    $("more").onsubmit = async (e) => {
      e.preventDefault();
      busy($("send"), true, "Sending…");
      try {
        render(await api(`/api/claims/${encodeURIComponent(claimId)}/evidence`, { method: "POST", form: await shrinkPhotos(new FormData($("more"))), token }));
        fail(""); $("more").reset(); $("previews").innerHTML = ""; $("drop").classList.remove("has-files");
        $("flash").innerHTML = (`<div class="notice ok">${ICON.check}<span>Thanks, the shop has your new photos and will take another look.</span></div>`);
      }
      catch (err) { fail(err.message); }
      busy($("send"), false);
    };
  </script>
</body>
</html>
